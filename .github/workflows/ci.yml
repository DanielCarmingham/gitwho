# Hand-written, unlike release.yml, which is generated by `dist` and must not
# be edited here.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS is where this actually runs; Linux is the platform the docs
        # call plausible-but-untried, so it is worth finding out here rather
        # than from someone else's bug report.
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Several tests shell out to real git and assert on what it resolves, so
      # a git older than 2.36 would fail them for the right reason but in a
      # confusing place. Both runners ship far newer; this records what broke.
      - run: git --version
      - run: cargo test --locked

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo fmt --check

  # Cargo.toml claims a minimum Rust version, and nothing else checks it.
  # A wrong claim here does not fail the build -- it fails `cargo install` for
  # whoever is on that version, which is a bug report rather than a red run.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked
