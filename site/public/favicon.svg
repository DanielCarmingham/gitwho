<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <title>gitwho</title>
  <!--
    The site's argument in one shape: three remotes, one identity.

    Three lines arriving from the left — the same repository cloned in three
    places — resolve into a single accented point. It is the hero diagram's
    right-hand panel reduced until only the movement is left, and it is drawn in
    the diagrams' own ink: flat strokes, butt caps, one accent, no gradient, no
    shadow, no rounded-app frame.

    Laid out on a 32-unit grid so the 3-unit stroke lands on 1.5px at 16px and
    the three lines stay three lines instead of a smear. That constraint is what
    ruled out a `gw` monogram: set at this size it collapses into a blob, and
    legibility at 16px beats the closer tie to the wordmark. The point is drawn
    last, over the junction, so the lines end *in* it rather than aim at it.
  -->
  <path
    class="wire"
    d="M4.5 5.5 L21.5 16 M4.5 16 H21.5 M4.5 26.5 L21.5 16"
    fill="none"
    stroke-width="3"
  />
  <circle class="point" cx="21.5" cy="16" r="5.5" />
  <style>
    /* --text and --accent from src/styles/tokens.css, both palettes. */
    .wire { stroke: #1a1a18; }
    .point { fill: #b4532a; }

    @media (prefers-color-scheme: dark) {
      .wire { stroke: #e8e8e4; }
      .point { fill: #e8834f; }
    }
  </style>
</svg>
