[package]
name = "gitfriend"
version = "0.1.0"
edition = "2021"

[lib]
name = "gitfriend"
path = "src/lib.rs"

[[bin]]
name = "gitfriend"
path = "src/main.rs"

[dependencies]
age = "0.12.1"
globset = "0.4"
keyring = "4.1.6"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.0"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
