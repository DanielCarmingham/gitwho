[package]
name = "gitwho"
version = "0.2.0"
edition = "2021"
description = "Pick the right git identity and credentials for a repository, automatically, wherever it lives on disk"
license = "MIT"
repository = "https://github.com/DanielCarmingham/gitwho"
# A Homebrew formula without a homepage fails `brew audit`.
homepage = "https://github.com/DanielCarmingham/gitwho"
readme = "README.md"
keywords = ["git", "credentials", "identity", "github", "cli"]
categories = ["command-line-utilities", "development-tools"]
# Measured, not guessed: `cargo +1.88 build --locked` succeeds and keyring
# 4.1.6 declares 1.88.0 itself. CI pins this exact version so it cannot drift.
rust-version = "1.88"
# Only the prose is excluded. `docs/accounts.toml.example` must stay in the
# tarball -- `init::TEMPLATE` is an `include_str!` of it, so excluding it breaks
# the build rather than just the docs.
exclude = [
    "docs/*.md",
    "CLAUDE.md",
    ".github/",
    ".claude/",
    ".dex/",
    "dist-workspace.toml",
    # The gitwho.cc website. Excluded wholesale rather than by pattern: it
    # carries node_modules, a build output and its own specs, none of which
    # belong in a crate tarball. Note this also covers `site/docs/superpowers/`,
    # which `docs/*.md` above would not have matched.
    "site/",
]

# Without this, `cargo binstall` falls back to a full source build: every one of
# its default filename patterns embeds the version, and dist's archives do not.
# The leading `{name}-{target}/` matters -- dist nests the binary in a directory.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
pkg-fmt = "txz"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"

[lib]
name = "gitwho"
path = "src/lib.rs"

[[bin]]
name = "gitwho"
path = "src/main.rs"

# `dist` builds release artifacts with `--profile dist`, so this must exist or
# every build job fails with "profile `dist` is not defined". Nothing local
# catches it: `dist plan` and `dist build --artifacts=global` compile no binary.
# Verify with `dist build --artifacts=local --target=<host triple>`.
[profile.dist]
inherits = "release"
lto = "thin"

[dependencies]
age = "0.12.1"
clap = { version = "4.6.6", features = ["derive"] }
globset = "0.4"
keyring = "4.1.6"
# Only for geteuid, which std does not expose. Already in the graph via
# keyring, so this costs nothing.
libc = "0.2"
rpassword = "7.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
thiserror = "2"
toml = "0.8"

[dev-dependencies]
tempfile = "3"
