# `dist init` rewrites this file and strips comments, so the reasoning behind
# these choices lives in CLAUDE.md under "Releasing".

[workspace]
members = ["cargo:."]

[dist]
cargo-dist-version = "0.32.0"
ci = "github"
installers = ["shell", "homebrew"]
tap = "DanielCarmingham/homebrew-tap"
publish-jobs = ["homebrew"]
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
]
install-path = "CARGO_HOME"
install-updater = false
pr-run-mode = "plan"
hosting = "github"
